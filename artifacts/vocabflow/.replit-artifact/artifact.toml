kind = "mobile"
previewPath = "/"
title = "VocabFlow"
description = "Ứng dụng Android học từ vựng Anh–Việt offline, dùng SQLite cục bộ, không đăng nhập. Quản lý từ cá nhân với giao diện tiếng Việt."
version = "1.0.0"
id = "artifacts/vocabflow"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25719

[services.development]
run = "pnpm --filter @workspace/vocabflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vocabflow", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vocabflow", "run", "serve" ]

[services.env]
PORT = "25719"
BASE_PATH = "/"
