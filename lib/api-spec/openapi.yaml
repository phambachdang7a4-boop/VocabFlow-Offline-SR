openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /dictionary/asset:
    get:
      operationId: downloadDictionaryAsset
      tags: [dictionary]
      summary: Download the pinned public reference dictionary once for local offline use
      responses:
        "200":
          description: Unmodified upstream SQLite file with pinned SHA-256
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "503":
          description: Dictionary asset storage temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryAssetError"
  /sync:
    post:
      operationId: mergeUserSyncData
      tags: [sync]
      summary: Merge the signed-in user's offline learning data
      security:
        - clerkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncSnapshot"
      responses:
        "200":
          description: The merged account snapshot, scoped to the authenticated Clerk user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncSnapshot"
        "400":
          description: Invalid sync data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Sync is temporarily unavailable; local changes remain queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sync/replace:
    post:
      operationId: replaceUserSyncData
      tags: [sync]
      summary: Replace the signed-in user's learning data with a confirmed backup
      security:
        - clerkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncSnapshot"
      responses:
        "200":
          description: The replaced account snapshot, scoped to the authenticated Clerk user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncSnapshot"
        "400":
          description: Invalid backup data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Account replacement is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UserSyncSnapshot:
      type: object
      required:
        [words, deletedWords, courseProgress, courseSelections, reviewStats]
      properties:
        revision:
          type: integer
          minimum: 0
          description: Account data generation used to prevent stale devices from restoring older data.
        words:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncWord"
        deletedWords:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncDeletedWord"
        courseProgress:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCourseProgress"
        courseSelections:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCourseSelection"
        reviewStats:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncReviewStat"
    SyncWord:
      type: object
      required:
        [
          syncId,
          term,
          meaning,
          ipa,
          example,
          note,
          dictionaryEntryId,
          dictionarySenseId,
          createdAt,
          contentUpdatedAt,
          reviewCount,
          level,
          learnedOn,
          nextReviewOn,
          completed,
          lastReviewedOn,
          frozen,
          progressUpdatedAt,
        ]
      properties:
        syncId:
          type: string
          minLength: 1
          maxLength: 7000
        term:
          type: string
          maxLength: 200
        meaning:
          type: string
          maxLength: 2000
        ipa:
          type: string
          maxLength: 200
        example:
          type: string
          maxLength: 4000
        note:
          type: string
          maxLength: 4000
        dictionaryEntryId:
          type: [integer, "null"]
          minimum: 1
        dictionarySenseId:
          type: [integer, "null"]
          minimum: 1
        createdAt:
          type: string
          format: date-time
        contentUpdatedAt:
          type: string
          format: date-time
        reviewCount:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
          maximum: 6
        learnedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        nextReviewOn:
          type: [string, "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        completed:
          type: boolean
        lastReviewedOn:
          type: [string, "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        frozen:
          type: boolean
        progressUpdatedAt:
          type: string
          format: date-time
    SyncDeletedWord:
      type: object
      required: [syncId, deletedAt]
      properties:
        syncId:
          type: string
          minLength: 1
          maxLength: 7000
        deletedAt:
          type: string
          format: date-time
    SyncCourseProgress:
      type: object
      required: [lessonId, currentIndex, stage, completedAt, updatedAt]
      properties:
        lessonId:
          type: string
          maxLength: 200
        currentIndex:
          type: integer
          minimum: 0
        stage:
          type: string
          enum: [flashcard, answer, selection, completed]
        completedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncCourseSelection:
      type: object
      required: [lessonId, wordId, selected, updatedAt]
      properties:
        lessonId:
          type: string
          maxLength: 200
        wordId:
          type: string
          maxLength: 200
        selected:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    SyncReviewStat:
      type: object
      required: [deviceId, day, reviewedCount, correctCount, updatedAt]
      properties:
        deviceId:
          type: string
          maxLength: 80
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reviewedCount:
          type: integer
          minimum: 0
        correctCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    DictionaryAssetError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
