openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /dictionary/asset:
    get:
      operationId: downloadDictionaryAsset
      tags: [dictionary]
      summary: Download the pinned public reference dictionary once for local offline use
      responses:
        "200":
          description: Unmodified upstream SQLite file with pinned SHA-256
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "503":
          description: Dictionary asset storage temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryAssetError"
  /dictionary/ipa-uk:
    get:
      operationId: downloadUkIpaSupplement
      tags: [dictionary]
      summary: Download the public UK IPA supplement for offline pronunciation lookup
      responses:
        "200":
          description: Verified UK IPA text supplement
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: UK IPA supplement storage temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryAssetError"
  /courses/asset:
    get:
      operationId: downloadOfflineCoursePackage
      tags: [courses]
      summary: Download the versioned public offline course package
      description: Supports byte ranges so interrupted downloads can resume safely.
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Complete offline course package
          content:
            application/octet-stream:
              schema:
                type: string
                description: Raw UTF-8 JSON package bytes
          headers:
            Accept-Ranges:
              schema:
                type: string
            X-Course-Data-Version:
              schema:
                type: string
            X-Course-Data-SHA256:
              schema:
                type: string
        "206":
          description: Requested byte range of the course package
          content:
            application/octet-stream:
              schema:
                type: string
                description: Raw UTF-8 JSON package bytes
          headers:
            Content-Range:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
        "416":
          description: Requested byte range is invalid
        "503":
          description: Course package storage is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryAssetError"
  /sync:
    post:
      operationId: mergeUserSyncData
      tags: [sync]
      summary: Merge the signed-in user's offline learning data
      security:
        - clerkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncSnapshot"
      responses:
        "200":
          description: The merged account snapshot, scoped to the authenticated Clerk user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncSnapshot"
        "400":
          description: Invalid sync data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Sync is temporarily unavailable; local changes remain queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sync/replace:
    post:
      operationId: replaceUserSyncData
      tags: [sync]
      summary: Replace the signed-in user's learning data with a confirmed backup
      security:
        - clerkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSyncSnapshot"
      responses:
        "200":
          description: The replaced account snapshot, scoped to the authenticated Clerk user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncSnapshot"
        "400":
          description: Invalid backup data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid Clerk session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Account replacement is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UserSyncSnapshot:
      type: object
      required:
        [words, deletedWords, courseProgress, courseSelections, reviewStats]
      properties:
        revision:
          type: integer
          minimum: 0
          description: Account data generation used to prevent stale devices from restoring older data.
        words:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncWord"
        deletedWords:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncDeletedWord"
        courseProgress:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCourseProgress"
        courseSelections:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCourseSelection"
        reviewStats:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncReviewStat"
        reviewSessions:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncReviewSession"
        reviewComboRewards:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncReviewComboReward"
        missionAwards:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncMissionAward"
        missionChests:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncMissionChest"
        corviFragmentAwards:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCorviFragmentAward"
        corviChestRewards:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCorviChestReward"
        collectionCrafts:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCollectionCraft"
        collectionPieceSpends:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncCollectionPieceSpend"
        missionShopPurchases:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncMissionShopPurchase"
        stoneInvestments:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncStoneInvestment"
        investmentStudyDays:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/SyncInvestmentStudyDay"
    SyncWord:
      type: object
      required:
        [
          syncId,
          term,
          meaning,
          ipa,
          example,
          note,
          dictionaryEntryId,
          dictionarySenseId,
          createdAt,
          contentUpdatedAt,
          reviewCount,
          level,
          learnedOn,
          nextReviewOn,
          completed,
          lastReviewedOn,
          frozen,
          progressUpdatedAt,
        ]
      properties:
        syncId:
          type: string
          minLength: 1
          maxLength: 7000
        term:
          type: string
          maxLength: 200
        meaning:
          type: string
          maxLength: 2000
        ipa:
          type: string
          maxLength: 200
        example:
          type: string
          maxLength: 4000
        note:
          type: string
          maxLength: 4000
        dictionaryEntryId:
          type: [integer, "null"]
          minimum: 1
        dictionarySenseId:
          type: [integer, "null"]
          minimum: 1
        createdAt:
          type: string
          format: date-time
        contentUpdatedAt:
          type: string
          format: date-time
        reviewCount:
          type: integer
          minimum: 0
        level:
          type: integer
          minimum: 1
          maximum: 6
        learnedOn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        nextReviewOn:
          type: [string, "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        completed:
          type: boolean
        lastReviewedOn:
          type: [string, "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        frozen:
          type: boolean
        progressUpdatedAt:
          type: string
          format: date-time
    SyncDeletedWord:
      type: object
      required: [syncId, deletedAt]
      properties:
        syncId:
          type: string
          minLength: 1
          maxLength: 7000
        deletedAt:
          type: string
          format: date-time
    SyncCourseProgress:
      type: object
      required: [lessonId, currentIndex, stage, completedAt, updatedAt]
      properties:
        lessonId:
          type: string
          maxLength: 200
        currentIndex:
          type: integer
          minimum: 0
        stage:
          type: string
          enum: [flashcard, answer, selection, completed]
        completedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncCourseSelection:
      type: object
      required: [lessonId, wordId, selected, updatedAt]
      properties:
        lessonId:
          type: string
          maxLength: 200
        wordId:
          type: string
          maxLength: 200
        selected:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    SyncReviewStat:
      type: object
      required: [deviceId, day, reviewedCount, correctCount, updatedAt]
      properties:
        deviceId:
          type: string
          maxLength: 80
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reviewedCount:
          type: integer
          minimum: 0
        correctCount:
          type: integer
          minimum: 0
        sessionCount:
          type: integer
          minimum: 0
          description: Number of times the learner started a review session on this device and day.
        updatedAt:
          type: string
          format: date-time
    SyncReviewSession:
      type: object
      required:
        [
          sessionId,
          deviceId,
          day,
          reviewedCount,
          correctCount,
          grade,
          completed,
          createdAt,
        ]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 120
        deviceId:
          type: string
          minLength: 1
          maxLength: 80
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reviewedCount:
          type: integer
          minimum: 0
        correctCount:
          type: integer
          minimum: 0
        activeDurationMs:
          type: integer
          minimum: 0
        maxCombo:
          type: integer
          minimum: 0
        grade:
          type: string
          enum: ["S+", "S", "A+", "A", "A-", "B+", "B", "B-", "C"]
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SyncReviewComboReward:
      type: object
      required: [sessionId, deviceId, day, comboIndex, comboLength, createdAt]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 120
        deviceId:
          type: string
          minLength: 1
          maxLength: 80
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        comboIndex:
          type: integer
          minimum: 1
        comboLength:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    SyncMissionAward:
      type: object
      required: [day, missionId, stone, completedAt]
      properties:
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        missionId:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^(review|add-words|lesson|grade|time|combo)-[1-3]$"
        stone:
          type: integer
          minimum: 1
          maximum: 20
        completedAt:
          type: string
          format: date-time
    SyncCorviFragmentAward:
      type: object
      required: [day, missionId, awardedAt]
      properties:
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        missionId:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^(review|add-words|lesson|grade|time|combo)-[1-3]$"
        awardedAt:
          type: string
          format: date-time
    SyncCorviChestReward:
      type: object
      required: [chestId, chestIndex, stone, createdAt]
      properties:
        chestId:
          type: string
          minLength: 1
          maxLength: 160
        chestIndex:
          type: integer
          minimum: 1
        stone:
          type: integer
          minimum: 1
          maximum: 10000
        createdAt:
          type: string
          format: date-time
    SyncMissionChest:
      type: object
      required:
        [
          chestId,
          day,
          missionId,
          baseStone,
          upgradeAttempts,
          rarity,
          opened,
          finalStone,
          createdAt,
          updatedAt,
        ]
      properties:
        chestId:
          type: string
          minLength: 1
          maxLength: 160
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        missionId:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^(review|add-words|lesson|grade|time|combo)-[1-3]$"
        baseStone:
          type: integer
          minimum: 1
          maximum: 20
        upgradeAttempts:
          type: integer
          minimum: 0
          maximum: 4
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        ruleSet:
          type: integer
          enum: [1, 2, 3, 4, 5, 6, 7]
          description: Optional for legacy clients; rule 7 caps tap upgrades at Platinum.
        superUpgrade:
          type: boolean
          description: Whether this chest has its guaranteed fourth upgrade.
        opened:
          type: boolean
        finalStone:
          type: integer
          minimum: 1
          maximum: 5050
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SyncCollectionCraft:
      type: object
      required: [craftId, rarity, craftIndex, artworkId, craftedAt]
      properties:
        craftId:
          type: string
          minLength: 1
          maxLength: 120
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        craftIndex:
          type: integer
          minimum: 1
        artworkId:
          type: string
          minLength: 1
          maxLength: 80
        craftedAt:
          type: string
          format: date-time
        pieceCost:
          type: integer
          enum: [-20, 0, 10, 20, 100]
          description: Current statue unlocks cost 10 fragments; Corvi duplicate compensation is -20 and an unowned Corvi statue is 0; omitted legacy values preserve the original 20-fragment cost.
    SyncCollectionPieceSpend:
      type: object
      required: [spendId, rarity, pieceCost, spentAt]
      properties:
        spendId:
          type: string
          minLength: 1
          maxLength: 160
        rarity:
          type: string
          enum: [common, uncommon, rare, epic, legendary]
        pieceCost:
          type: integer
          enum: [20, 100]
        spentAt:
          type: string
          format: date-time
    SyncMissionShopPurchase:
      type: object
      required:
        [purchaseId, day, slot, rarity, stoneCost, discountPercent, purchasedAt]
      properties:
        purchaseId:
          type: string
          minLength: 1
          maxLength: 80
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        slot:
          type: integer
          minimum: 0
          maximum: 2
        rarity:
          type: string
          enum:
            [
              rare,
              epic,
              legendary,
              low_insurance,
              collateral_asset,
              low_capital_invite,
              high_capital_invite,
            ]
        stoneCost:
          type: integer
          minimum: 0
        discountPercent:
          type: integer
          minimum: 0
          maximum: 60
        purchasedAt:
          type: string
          format: date-time
    SyncStoneInvestment:
      type: object
      required:
        [
          investmentId,
          plan,
          principal,
          durationDays,
          startDay,
          endDay,
          status,
          settlementAmount,
          createdAt,
          settledAt,
        ]
      properties:
        investmentId:
          type: string
          minLength: 12
          maxLength: 140
        plan:
          type: string
          enum: [safe, balanced, risky]
        principal:
          type: integer
          minimum: 1
          maximum: 900000000
        durationDays:
          type: integer
          enum: [7, 14]
        startDay:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        endDay:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        status:
          type: string
          enum: [active, succeeded, failed]
        settlementAmount:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          nullable: true
        lowInsuranceUsed:
          type: boolean
          description: Optional for older clients; whether low insurance was selected at investment start.
        capitalInvite:
          type: string
          enum: [low, high]
          nullable: true
          description: Optional for older clients; the one-use capital invite applied at investment start.
        collateralUsed:
          type: boolean
          description: Optional for older clients; whether collateral was consumed after a risky failure.
        forceMajeureHit:
          type: boolean
          nullable: true
          description: Optional for older clients; whether this investment's one-time force majeure event was rolled.
    SyncInvestmentStudyDay:
      type: object
      required: [day, reviewed, studiedCourse, updatedAt]
      properties:
        day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reviewed:
          type: boolean
        studiedCourse:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    DictionaryAssetError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
