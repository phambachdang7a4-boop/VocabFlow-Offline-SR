openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /dictionary/asset:
    get:
      operationId: downloadDictionaryAsset
      tags: [dictionary]
      summary: Download the pinned public reference dictionary once for local offline use
      responses:
        "200":
          description: Unmodified upstream SQLite file with pinned SHA-256
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "503":
          description: Dictionary asset storage temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryAssetError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DictionaryAssetError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

