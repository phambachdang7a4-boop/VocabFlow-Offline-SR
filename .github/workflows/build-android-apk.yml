name: Build VocabFlow Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm --filter @workspace/vocabflow exec expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: artifacts/vocabflow/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vocabflow-debug-apk
          path: artifacts/vocabflow/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
